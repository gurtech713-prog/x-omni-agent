org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# Required by AGP 9.x with built-in Kotlin: KSP adds Kotlin source sets
# (debug, release) for generated code. Without this flag, the build fails with
# "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with
# built-in Kotlin." The flag explicitly allows KSP's source set additions.
android.disallowKotlinSourceSets=false


kotlin.code.style=official
